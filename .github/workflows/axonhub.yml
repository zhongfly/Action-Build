name: Release

on:
  workflow_dispatch:

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: looplj/axonhub
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          stable: true
          cache: true

      - name: Build main binary
        run: go build -ldflags "-s -w" -tags=nomsgpack -o axonhub ./cmd/axonhub

      - name: Build schema generator
        run: cd cmd/schema && go build -o schema

      - name: Build llm module packages
        run: cd llm && go build ./...

      - name: Verify all packages compile
        run: go build ./...

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: looplj/axonhub
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

  goreleaser:
    runs-on: ubuntu-latest
    needs: [build-backend,build-frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: looplj/axonhub
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install
        working-directory: frontend

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Update VERSION file
        if: ${{ !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'rc') }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "Updating VERSION file to: $VERSION"
          echo "$VERSION" > internal/build/VERSION
          git add internal/build/VERSION
      - name: Commit VERSION file
        if: ${{ !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'rc') }}
        continue-on-error: true
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if VERSION file has changes
          if git diff --cached --quiet -- internal/build/VERSION; then
            echo "No changes to VERSION files"
          else
            # Commit VERSION files with [skip ci] to avoid triggering other workflows
            git commit -m "chore: update VERSION to ${GITHUB_REF#refs/tags/} [skip ci]"
          fi
      - name: Prepare release assets
        run: |
          make build-frontend
          make generate-schema
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: build --clean --skip=before --skip=validate --single-target
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOS: windows
          GOARCH: amd64
      - name: Upload assets
        uses: actions/upload-artifact@v7
        with:
          name: axonhub
          path: .builds/*
