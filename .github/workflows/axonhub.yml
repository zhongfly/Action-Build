name: Axonhub

on:
  workflow_dispatch:
    inputs:
      pr_numbers:
        description: 'PR numbers to merge (comma-separated, e.g. 123,456)'
        required: false
        default: ''

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: looplj/axonhub
          fetch-depth: 0

      - name: Merge PRs
        if: ${{ inputs.pr_numbers != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBERS: ${{ inputs.pr_numbers }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          IFS=',' read -ra PRS <<< "$PR_NUMBERS"
          for pr in "${PRS[@]}"; do
            pr=$(echo "$pr" | xargs)  # trim whitespace
            if [ -z "$pr" ]; then
              continue
            fi
            echo "=== Processing PR #$pr ==="

            # Fetch PR head
            git fetch origin "pull/$pr/head:pr-$pr"

            # Check if merge would have conflicts using merge-tree
            if git merge-tree --write-tree HEAD "pr-$pr" > /dev/null 2>&1; then
              echo "PR #$pr can be merged without conflicts, merging..."
              git merge --no-edit "pr-$pr"
            else
              echo "PR #$pr has conflicts, skipping..."
            fi
          done

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install
        working-directory: frontend

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: Update VERSION file
        if: ${{ !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'rc') }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "Updating VERSION file to: $VERSION"
          echo "$VERSION" > internal/build/VERSION
          git add internal/build/VERSION
      - name: Commit VERSION file
        if: ${{ !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'rc') }}
        continue-on-error: true
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if VERSION file has changes
          if git diff --cached --quiet -- internal/build/VERSION; then
            echo "No changes to VERSION files"
          else
            # Commit VERSION files with [skip ci] to avoid triggering other workflows
            git commit -m "chore: update VERSION to ${GITHUB_REF#refs/tags/} [skip ci]"
          fi
      - name: Prepare release assets
        run: |
          make build-frontend
          make generate-schema
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: build --clean --skip=before --skip=validate --single-target
          workdir: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOS: windows
          GOARCH: amd64
      - name: Upload assets
        uses: actions/upload-artifact@v7
        with:
          name: axonhub
          path: ./.builds/build_windows_amd64_v1/axonhub.exe
